name: Build Windows installer manually

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional SemVer tag matching the Host version; blank creates v<version>-build.<run number>'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: manual-windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: Windows x64 installer and real acceptance
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      delivery_artifact: ${{ steps.metadata.outputs.delivery_artifact }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      NUGET_XMLDOC_MODE: skip
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Verify toolchain and hosted administrator token
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Installer acceptance requires a disposable GitHub-hosted runner.'
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'The runner token is not elevated; administrator acceptance cannot run.'
            }
          } finally { $identity.Dispose() }
          if ((node --version) -ne 'v24.16.0') { throw 'Unexpected Node.js version.' }
          $expectedSdk = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
          $actualSdk = (dotnet --version).Trim()
          Write-Host "Selected .NET SDK: $actualSdk (expected $expectedSdk)"
          if ($actualSdk -ne $expectedSdk) { throw "Unexpected .NET SDK version: $actualSdk" }

      - name: Validate the release tag and package version
        id: metadata
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath src/Takao.Host/Takao.Host.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          $identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          $semver = '^(?<core>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?:-(?<pre>' + $identifier + '(?:\.' + $identifier + ')*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          $package = [regex]::Match($version, $semver)
          if (-not $package.Success) { throw 'Host version is not valid SemVer.' }
          $tag = ([string]$env:REQUESTED_RELEASE_TAG).Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $prefix = if ($package.Groups['pre'].Success) { $package.Groups['pre'].Value + '.' } else { '' }
            $tag = 'v' + $package.Groups['core'].Value + '-' + $prefix + 'build.' + $env:GITHUB_RUN_NUMBER
          }
          $tagVersion = if ($tag.StartsWith('v', [StringComparison]::Ordinal)) { [regex]::Match($tag.Substring(1), $semver) } else { $null }
          if ($null -eq $tagVersion -or -not $tagVersion.Success -or $tag.Length -gt 128) { throw 'release_tag must be a valid v-prefixed SemVer tag of at most 128 characters.' }
          if ($tagVersion.Groups['core'].Value -cne $package.Groups['core'].Value) { throw 'Release tag base version must match the Host project version.' }
          $encodedTag = [Uri]::EscapeDataString($tag)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $response = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encodedTag" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30
          if ($response.StatusCode -eq 200) { throw 'The requested tag already exists. Choose a new tag.' }
          if ($response.StatusCode -ne 404) { throw "GitHub could not confirm tag availability: HTTP $($response.StatusCode)" }
          $repository = $env:GITHUB_REPOSITORY.Split('/', 2)
          $query = 'query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId isDraft}}}'
          $body = @{ query = $query; variables = @{ owner = $repository[0]; name = $repository[1]; tag = $tag } } | ConvertTo-Json -Depth 5
          $lookup = Invoke-RestMethod -Uri $env:GITHUB_GRAPHQL_URL -Method Post -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 30
          if (($lookup.PSObject.Properties.Name -contains 'errors') -or $null -eq $lookup.data.repository) { throw 'GitHub could not confirm Release availability.' }
          if ($null -ne $lookup.data.repository.release) { throw 'A published or draft Release already uses this tag. Choose a new tag.' }
          $artifact = "Takao-v$version-win-x64-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          "TASKMANAGER_PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "TASKMANAGER_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "TASKMANAGER_SOURCE_COMMIT=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "delivery_artifact=$artifact" >> $env:GITHUB_OUTPUT
          "prerelease=$($tagVersion.Groups['pre'].Success.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Package $version; new release tag $tag"

      - name: Install the standard NSIS compiler
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --version=3.12.0 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed: $LASTEXITCODE" }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'NSIS compiler is missing.' }
          $compilerVersion = & $compiler /VERSION
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -ne 'v3.12') { throw 'Unexpected NSIS compiler version.' }
          Write-Host "NSIS $compilerVersion"
          "TASKMANAGER_NSIS_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build the locked self-contained installer
        run: ./scripts/build-installer.ps1 -MakeNsisPath $env:TASKMANAGER_NSIS_COMPILER -ReleaseTag $env:TASKMANAGER_RELEASE_TAG -SourceCommit $env:TASKMANAGER_SOURCE_COMMIT

      - name: Verify the installed application and uninstall
        run: |
          ./scripts/test-installer-ci.ps1 `
            -InstallerPath "output/releases/Takao-v$env:TASKMANAGER_PACKAGE_VERSION-win-x64-setup.exe" `
            -PayloadDirectory output/Takao-win-x64

      - name: Require the complete delivery set
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            "output/installer-ci/delivery/Takao-v$env:TASKMANAGER_PACKAGE_VERSION-win-x64-setup.exe",
            'output/installer-ci/delivery/SHA256SUMS',
            'output/installer-ci/delivery/acceptance.json',
            'output/installer-ci/delivery/acceptance.md'
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Required artifact is missing: $file" }
            if ((Get-Item -LiteralPath $file).Length -eq 0) { throw "Required artifact is empty: $file" }
          }

      - name: Upload the verified installer, checksums, and acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.metadata.outputs.delivery_artifact }}
          path: |
            output/installer-ci/delivery/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload application screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-screenshots-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/installer-ci/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload available acceptance diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            output/installer-ci/acceptance.json
            output/installer-ci/acceptance.md
            output/installer-ci/desktop-startup.json
            output/installer-ci/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish the verified installer and Git tag
    needs: installer
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.installer.outputs.release_tag }}
      PACKAGE_VERSION: ${{ needs.installer.outputs.package_version }}
      RELEASE_PRERELEASE: ${{ needs.installer.outputs.prerelease }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Download only this run's verified delivery
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.installer.outputs.delivery_artifact }}
          path: ${{ runner.temp }}/verified-delivery

      - name: Independently verify the executable and acceptance report
        id: verified
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Source commit must be the complete workflow commit SHA.' }
          $delivery = Join-Path $env:RUNNER_TEMP 'verified-delivery'
          $installerName = "Takao-v$env:PACKAGE_VERSION-win-x64-setup.exe"
          $expected = @($installerName, 'SHA256SUMS', 'acceptance.json', 'acceptance.md')
          $entries = @(Get-ChildItem -LiteralPath $delivery -Force)
          if ($entries.Count -ne $expected.Count) { throw 'The delivery must contain exactly the four expected release files.' }
          foreach ($entry in $entries) {
            if ($entry.PSIsContainer -or ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $expected -cnotcontains $entry.Name -or $entry.Length -eq 0) {
              throw 'Unexpected or empty content in the release delivery.'
            }
          }
          $installer = Join-Path $delivery $installerName
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksums = Get-Content -LiteralPath (Join-Path $delivery 'SHA256SUMS') -Raw
          $pattern = '\A(?<hash>[0-9a-f]{64})  ' + [regex]::Escape($installerName) + '\r?\n?\z'
          $checksum = [regex]::Match($checksums, $pattern)
          if (-not $checksum.Success -or $checksum.Groups['hash'].Value -cne $actualHash) { throw 'Setup.exe does not match the single SHA256SUMS entry.' }
          $acceptance = Get-Content -LiteralPath (Join-Path $delivery 'acceptance.json') -Raw | ConvertFrom-Json
          if ($acceptance.result -cne 'PASS' -or $acceptance.sourceCommit -cne $env:SOURCE_SHA -or $acceptance.desktopAssertions -lt 42) {
            throw 'Acceptance must pass at least 42 desktop assertions against this exact workflow commit.'
          }
          if ($acceptance.installer.filename -cne $installerName -or $acceptance.installer.version -cne $env:PACKAGE_VERSION -or $acceptance.installer.sha256 -cne $actualHash -or $acceptance.installer.bytes -ne (Get-Item -LiteralPath $installer).Length) {
            throw 'The independently hashed executable differs from the accepted installer.'
          }
          "installer_sha256=$actualHash" >> $env:GITHUB_OUTPUT
          Write-Host "Verified $installerName, SHA256 $actualHash, source $env:SOURCE_SHA"

      - name: Create a draft with all assets, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_INSTALLER_SHA256: ${{ steps.verified.outputs.installer_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          $semver = '^(?<core>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))(?:-(?<pre>' + $identifier + '(?:\.' + $identifier + ')*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
          $package = [regex]::Match($env:PACKAGE_VERSION, $semver)
          $tag = $env:RELEASE_TAG
          $tagVersion = if ($tag.StartsWith('v', [StringComparison]::Ordinal)) { [regex]::Match($tag.Substring(1), $semver) } else { $null }
          if (-not $package.Success -or $null -eq $tagVersion -or -not $tagVersion.Success -or $tag.Length -gt 128 -or $tagVersion.Groups['core'].Value -cne $package.Groups['core'].Value) { throw 'Release metadata failed independent SemVer and Host base-version validation.' }
          $isPrerelease = $tagVersion.Groups['pre'].Success.ToString().ToLowerInvariant()
          if ($isPrerelease -cne $env:RELEASE_PRERELEASE) { throw 'Release prerelease classification changed between jobs.' }
          $encodedTag = [Uri]::EscapeDataString($tag)
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $response = Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encodedTag" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30
          if ($response.StatusCode -eq 200) { throw 'The target tag was created while this build ran; publication stopped.' }
          if ($response.StatusCode -ne 404) { throw "GitHub could not recheck the release tag: HTTP $($response.StatusCode)" }
          $repository = $env:GITHUB_REPOSITORY.Split('/', 2)
          $query = 'query($owner:String!,$name:String!,$tag:String!){repository(owner:$owner,name:$name){release(tagName:$tag){databaseId isDraft}}}'
          $body = @{ query = $query; variables = @{ owner = $repository[0]; name = $repository[1]; tag = $tag } } | ConvertTo-Json -Depth 5
          $lookup = Invoke-RestMethod -Uri $env:GITHUB_GRAPHQL_URL -Method Post -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 30
          if (($lookup.PSObject.Properties.Name -contains 'errors') -or $null -eq $lookup.data.repository) { throw 'GitHub could not recheck published and draft releases.' }
          if ($null -ne $lookup.data.repository.release) { throw 'The target published or draft Release already exists; publication stopped.' }
          $delivery = Join-Path $env:RUNNER_TEMP 'verified-delivery'
          $installerName = "Takao-v$env:PACKAGE_VERSION-win-x64-setup.exe"
          $legacyInstallerName = "BlueDomainTaskManager-v$env:PACKAGE_VERSION-win-x64-setup.exe"
          # Preserve the independently accepted four-file delivery. The old
          # filename is a byte-identical publication alias for shipped clients.
          $publication = Join-Path $env:RUNNER_TEMP 'release-assets'
          if (Test-Path -LiteralPath $publication) { throw 'Publication staging must be fresh.' }
          New-Item -ItemType Directory -Path $publication | Out-Null
          foreach ($name in @($installerName, 'acceptance.json', 'acceptance.md')) { Copy-Item -LiteralPath (Join-Path $delivery $name) -Destination $publication }
          Copy-Item -LiteralPath (Join-Path $publication $installerName) -Destination (Join-Path $publication $legacyInstallerName)
          $installerBytes = (Get-Item -LiteralPath (Join-Path $publication $installerName)).Length
          foreach ($name in @($installerName, $legacyInstallerName)) {
            $file = Get-Item -LiteralPath (Join-Path $publication $name)
            if ($file.Length -ne $installerBytes -or (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:VERIFIED_INSTALLER_SHA256) { throw 'Publication aliases must exactly match the accepted installer.' }
          }
          [IO.File]::WriteAllLines((Join-Path $publication 'SHA256SUMS'), @("$env:VERIFIED_INSTALLER_SHA256  $installerName", "$env:VERIFIED_INSTALLER_SHA256  $legacyInstallerName"), [Text.UTF8Encoding]::new($false))
          $files = @($installerName, $legacyInstallerName, 'SHA256SUMS', 'acceptance.json', 'acceptance.md') | ForEach-Object { Join-Path $publication $_ }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = @(
            "Windows x64 NSIS installer, package version $env:PACKAGE_VERSION.",
            '',
            'Startup apps now display real Windows enabled/disabled states, with correct status sorting and live detail refresh. Run, 32-bit Run and Startup folders retain their exact state sources.',
            'Only recognized Windows approval records are interpreted. Unknown formats, scope conflicts and RunOnce keep explicit reasons; status changes continue through Windows startup settings.',
            "Startup fix and local Windows verification (514 assertions): $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:SOURCE_SHA/docs/STARTUP-STATUS-RESULTS.md",
            "Release details: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:SOURCE_SHA/docs/RELEASE-V1.1.1-STARTUP-STATUS.md",
            "Also includes the disk information, throughput-only disk charts and white performance chart baseline: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:SOURCE_SHA/docs/RELEASE-V1.1.1-DISK-CHARTS.md",
            '',
            'Includes .NET 10, ASP.NET Core and Electron. Installation and application startup require administrator permission. The installer is unsigned.',
            '',
            'The disposable Windows runner verified complete installed-file hashes, real Windows collection and local coreclr loading, at least 42 Electron desktop assertions, same-path reinstall, and uninstall with user-file preservation. IFEO configuration remained unchanged.',
            '',
            "Source commit: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:SOURCE_SHA",
            "Build and acceptance: $runUrl",
            "Installer SHA256: $env:VERIFIED_INSTALLER_SHA256",
            '',
            'Assets: Takao Setup.exe and its identical legacy filename alias, SHA256SUMS for both, acceptance.json and acceptance.md. Application screenshots remain available in the workflow artifacts for 14 days.'
          )
          $notesPath = Join-Path $env:RUNNER_TEMP 'installer-release-notes.md'
          [IO.File]::WriteAllLines($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          # Atomically reserve a new tag. GitHub refuses an existing ref, so a
          # concurrent publisher cannot make this job reuse or overwrite its tag.
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:SOURCE_SHA" --silent
          if ($LASTEXITCODE -ne 0) { throw 'Creating the new source tag failed; no existing tag is overwritten.' }
          $reference = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encodedTag" -Headers $headers -TimeoutSec 30
          if ($reference.object.type -cne 'commit' -or $reference.object.sha -cne $env:SOURCE_SHA) { throw 'The new tag does not point to the verified workflow commit.' }
          "Reserved tag $tag at source commit $env:SOURCE_SHA. If publication fails, this tag and any draft are retained; rerun with a new tag." >> $env:GITHUB_STEP_SUMMARY
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --verify-tag --target $env:SOURCE_SHA --draft --prerelease=$isPrerelease --title "Takao $tag" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation or asset upload failed; any created draft is retained for inspection.' }
          # The REST release-by-tag endpoint cannot find drafts. The official CLI
          # resolves the draft through GraphQL; then pin every operation to its ID.
          $draftJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json databaseId,isDraft,tagName
          if ($LASTEXITCODE -ne 0) { throw 'The created draft could not be resolved through the official CLI.' }
          $draftIdentity = $draftJson | ConvertFrom-Json
          if (-not $draftIdentity.isDraft -or $draftIdentity.tagName -cne $tag -or $draftIdentity.databaseId -le 0) { throw 'The created release is not the expected draft.' }
          $releaseId = [long]$draftIdentity.databaseId
          $releaseApi = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
          $draft = Invoke-RestMethod -Uri $releaseApi -Headers $headers -TimeoutSec 30
          $expectedAssets = @($installerName, $legacyInstallerName, 'SHA256SUMS', 'acceptance.json', 'acceptance.md')
          if ($draft.id -ne $releaseId -or $draft.tag_name -cne $tag -or $draft.target_commitish -cne $env:SOURCE_SHA -or -not $draft.draft -or $draft.assets.Count -ne $expectedAssets.Count) { throw 'The fixed draft does not match this commit and the complete expected delivery.' }
          foreach ($asset in $draft.assets) {
            if ($expectedAssets -cnotcontains $asset.name -or $asset.size -le 0 -or $asset.state -cne 'uploaded' -or @($draft.assets | Where-Object name -CEQ $asset.name).Count -ne 1) { throw 'Unexpected, duplicate, incomplete or empty uploaded release asset.' }
          }
          foreach ($name in @($installerName, $legacyInstallerName)) {
            $asset = @($draft.assets | Where-Object name -CEQ $name)[0]
            $expectedUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
            if ($asset.size -ne $installerBytes -or $asset.digest -cne "sha256:$env:VERIFIED_INSTALLER_SHA256" -or [Uri]::UnescapeDataString($asset.browser_download_url) -cne $expectedUrl) { throw 'The uploaded aliases differ from the accepted installer or official release URL.' }
          }
          $reference = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encodedTag" -Headers $headers -TimeoutSec 30
          if ($reference.object.type -cne 'commit' -or $reference.object.sha -cne $env:SOURCE_SHA) { throw 'The tag changed before publication; the draft remains unpublished.' }
          $publishBody = @{ draft = $false; prerelease = ($isPrerelease -ceq 'true'); make_latest = $(if ($isPrerelease -ceq 'true') { 'false' } else { 'true' }) } | ConvertTo-Json
          [void](Invoke-RestMethod -Uri $releaseApi -Method Patch -Headers $headers -ContentType 'application/json' -Body $publishBody -TimeoutSec 30)
          $published = Invoke-RestMethod -Uri $releaseApi -Headers $headers -TimeoutSec 30
          if ($published.id -ne $releaseId -or $published.tag_name -cne $tag -or $published.draft -or $published.prerelease.ToString().ToLowerInvariant() -cne $isPrerelease) { throw 'The fixed release publication status could not be confirmed.' }
          "Published [$tag]($($published.html_url)) from source commit $env:SOURCE_SHA with the verified installer and acceptance evidence." >> $env:GITHUB_STEP_SUMMARY
